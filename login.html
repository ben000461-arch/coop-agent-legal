<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body data-page="login">
<div id="fatal" class="fatal" hidden><div class="box" role="alert"></div></div>

  <div class="card">
    <h1>co|op Agent</h1>
    <p class="muted">Log in to see what your agent has been doing.</p>
    <form id="form" novalidate>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false">

      <button id="go" class="btn block" type="submit">Log in</button>
    </form>
    <p class="muted small">Don’t have a login? Accounts are invite-only. Email <a href="mailto:cooptech126@gmail.com">cooptech126@gmail.com</a>.</p>
